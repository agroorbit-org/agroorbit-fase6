<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura integrada AgroOrbit Horizon</title><desc id="desc">Sensores virtuais geram dados Bronze, validados na Silver e agregados na Gold. Random Forest e regras produzem alertas para o dashboard. Registros inválidos vão para quarentena.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6c895c"/></marker><style>text{font-family:Arial,sans-serif}.cap{font-size:12px;letter-spacing:2px;fill:#7a8e68}.title{font-size:20px;fill:#355334;font-weight:bold}.label{font-size:14px;fill:#6b7f5a}.arrow{fill:none;stroke:#7f986e;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fffef8;stroke:#d8e3c9;stroke-width:1.5}</style></defs>
<rect width="1200" height="680" rx="20" fill="#f4f6eb"/><text x="45" y="52" class="cap">AGROORBIT HORIZON / FASE 6</text><text x="45" y="95" font-size="32" font-weight="bold" fill="#23482f">Do sinal do campo à decisão rastreável.</text><text x="45" y="129" class="label">Plataforma local • dados sintéticos • fluxo executável • Python + React</text>
<g transform="translate(45 183)"><rect width="190" height="142" rx="14" class="box"/><text x="20" y="30" class="cap">01 / COLETA</text><text x="20" y="63" class="title">Sensores virtuais</text><text x="20" y="90" class="label">Temperatura · solo</text><text x="20" y="113" class="label">Luz · chuva + NDVI</text></g>
<g transform="translate(277 183)"><rect width="190" height="142" rx="14" class="box"/><text x="20" y="30" class="cap">02 / BRONZE</text><text x="20" y="63" class="title">Eventos originais</text><text x="20" y="90" class="label">JSONL · lote + event_id</text><text x="20" y="113" class="label">Preservação e replay</text></g>
<g transform="translate(509 183)"><rect width="190" height="142" rx="14" class="box"/><text x="20" y="30" class="cap">03 / SILVER</text><text x="20" y="63" class="title">Dados confiáveis</text><text x="20" y="90" class="label">Schema · faixas · horário</text><text x="20" y="113" class="label">CSV sem duplicatas</text></g>
<g transform="translate(741 183)"><rect width="190" height="142" rx="14" class="box"/><text x="20" y="30" class="cap">04 / GOLD</text><text x="20" y="63" class="title">Features diárias</text><text x="20" y="90" class="label">Janelas de 7 / 14 dias</text><text x="20" y="113" class="label">Por propriedade / talhão</text></g>
<path d="M235 252H272M467 252H504M699 252H736" class="arrow"/>
<g transform="translate(509 380)"><rect width="190" height="100" rx="14" fill="#f3e7d5" stroke="#e4cfaa"/><text x="20" y="35" class="title">Quarentena</text><text x="20" y="64" class="label">Payload + motivo</text><text x="20" y="85" class="label">Qualidade auditável</text></g><path d="M604 325V374" class="arrow"/>
<g transform="translate(972 183)"><rect width="183" height="142" rx="14" fill="#e6efd6" stroke="#ceddbb"/><text x="17" y="30" class="cap">05 / INTELIGÊNCIA</text><text x="17" y="63" class="title">Random Forest</text><text x="17" y="90" class="label">300 árvores exportadas</text><text x="17" y="113" class="label">+ regras explicáveis</text></g><path d="M931 252H966" class="arrow"/>
<g transform="translate(853 390)"><rect width="302" height="128" rx="14" fill="#274d35"/><text x="22" y="34" font-size="12" letter-spacing="2" fill="#cce295">06 / AÇÃO AUTOMATIZADA</text><text x="22" y="70" font-size="21" font-weight="bold" fill="#f0f6e7">Alertas + recomendações</text><text x="22" y="100" font-size="14" fill="#b7cea6">Motivos · versão da regra · evidências</text></g><path d="M1064 325V384" class="arrow"/>
<g transform="translate(45 390)"><rect width="340" height="128" rx="14" fill="#dfeacb" stroke="#cbd9b4"/><text x="22" y="35" class="cap">DASHBOARD + API PYTHON</text><text x="22" y="70" class="title">Indicadores, histórico e decisões</text><text x="22" y="100" class="label">Selecionar cenário → processar → visualizar</text></g><path d="M853 467H744V559H211V524" class="arrow"/><path d="M139 390V333" class="arrow"/>
<line x1="45" y1="606" x2="1155" y2="606" stroke="#dbe4ce"/><text x="45" y="638" font-size="13" fill="#849572">Persistência em arquivos locais • simulação em lote • decisões atuais suspensas quando a coleta está incompleta</text>
</svg>
